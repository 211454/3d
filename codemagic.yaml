workflows:
  ios-compile:
    name: AUTOKLINIK 3D - iOS compile check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile for iPhone without signing
        script: |
          xcodebuild build \
            -project AUTOKLINIK3D.xcodeproj \
            -scheme AUTOKLINIK3D \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -resultBundlePath build/Compile.xcresult \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Compile.xcresult

  ios-ad-hoc:
    name: AUTOKLINIK 3D - signed iPhone build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: de.autoklinik.alignment.prototype
    scripts:
      - name: Apply the Apple provisioning profile
        script: xcode-project use-profiles
      - name: Build the signed IPA
        script: |
          xcode-project build-ipa \
            --project AUTOKLINIK3D.xcodeproj \
            --scheme AUTOKLINIK3D
    artifacts:
      - build/ios/ipa/*.ipa

  ios-altstore:
    name: AUTOKLINIK 3D - unsigned IPA for AltStore
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build iPhone app without Apple signing
        script: |
          xcodebuild build \
            -project AUTOKLINIK3D.xcodeproj \
            -scheme AUTOKLINIK3D \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for AltStore
        script: |
          set -e
          APP_PATH="build/Build/Products/Debug-iphoneos/AUTOKLINIK3D.app"
          test -d "$APP_PATH"
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/
          (cd artifacts && zip -qry AUTOKLINIK3D-unsigned.ipa Payload)
          test -s artifacts/AUTOKLINIK3D-unsigned.ipa
    artifacts:
      - artifacts/AUTOKLINIK3D-unsigned.ipa
