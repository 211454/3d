workflows:
  ios-compile:
    name: AUTOKLINIK 3D - iOS compile check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile for iPhone without signing
        script: |
          xcodebuild build \
            -project AUTOKLINIK3D.xcodeproj \
            -scheme AUTOKLINIK3D \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -resultBundlePath build/Compile.xcresult \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Compile.xcresult

  ios-ad-hoc:
    name: AUTOKLINIK 3D - signed iPhone build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: de.autoklinik.alignment.prototype
    scripts:
      - name: Apply the Apple provisioning profile
        script: xcode-project use-profiles
      - name: Build the signed IPA
        script: |
          xcode-project build-ipa \
            --project AUTOKLINIK3D.xcodeproj \
            --scheme AUTOKLINIK3D
    artifacts:
      - build/ios/ipa/*.ipa
